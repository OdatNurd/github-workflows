on:
  workflow_call:
    inputs:
      # The version of Node.js to use for the workflow steps.
      node-version:
        required: false
        type: number
        default: 24

      # The release tag and package version. The tag must already exist; it is
      # checked out before the package is built.
      package-version:
        required: true
        type: string

      # The name of the pnpm script to run for building the package. This step
      # is skipped if the script does not exist.
      build-script:
        required: false
        type: string
        default: 'build'

      # The name of the pnpm script to run for testing the package prior to
      # publishing. This step is skipped if the script does not exist.
      test-script:
        required: false
        type: string
        default: 'test'

      # A boolean flag to determine whether to create a GitHub Release after a
      # successful publish.
      create-release:
        required: false
        type: boolean
        default: false

jobs:
  publish-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        name: Check out repository
        with:
          fetch-depth: 0

      - name: Verify release tag exists
        env:
          RELEASE_TAG: ${{ inputs.package-version }}
        run: |
          set -euo pipefail

          if [[ -z "$RELEASE_TAG" || "$RELEASE_TAG" == refs/* ]]; then
            echo "::error::A release tag name is required (for example, v1.2.3)."
            exit 1
          fi

          if ! git check-ref-format "refs/tags/${RELEASE_TAG}"; then
            echo "::error::'$RELEASE_TAG' is not a valid Git tag name."
            exit 1
          fi

          git fetch --force --tags origin

          if ! git rev-parse --verify --quiet "refs/tags/${RELEASE_TAG}^{commit}" > /dev/null; then
            echo "::error::Tag '$RELEASE_TAG' does not exist in this repository. Create and push the tag before publishing."
            exit 1
          fi

      - name: Check out release tag
        env:
          RELEASE_TAG: ${{ inputs.package-version }}
        run: |
          set -euo pipefail
          git checkout --detach "refs/tags/${RELEASE_TAG}"

      - uses: pnpm/action-setup@v6
        name: Install pnpm
        with:
          run_install: false

      - uses: actions/setup-node@v6
        name: Setup node
        with:
          node-version: ${{ inputs.node-version }}
          registry-url: 'https://registry.npmjs.org/'
          cache: pnpm

      - name: Get Package Version from Tag
        env:
          RELEASE_TAG: ${{ inputs.package-version }}
        run: |
          set -euo pipefail
          printf 'VERSION=%s\n' "${RELEASE_TAG#v}" >> "$GITHUB_ENV"

      - name: Determine NPM distribution tag
        run: |
          if [[ "$VERSION" == *"-"* ]]; then
            SUFFIX="${VERSION#*-}"
            DIST_TAG="${SUFFIX%%.*}"
            echo "NPM_TAG=$DIST_TAG" >> $GITHUB_ENV
            echo "Prerelease detected. Publishing to tag: $DIST_TAG"
          else
            echo "NPM_TAG=latest" >> $GITHUB_ENV
            echo "Stable release detected. Publishing to tag: latest"
          fi

      - name: Update package version in control file
        run: sed -i -e "s/{{VERSION}}/$VERSION/g" package.json

      - name: Verify npm version is unpublished
        env:
          RELEASE_VERSION: ${{ inputs.package-version }}
        run: |
          set -euo pipefail

          version="${RELEASE_VERSION#v}"
          package_name="$(node -p "require('./package.json').name")"
          encoded_name="$(PACKAGE_NAME="$package_name" node -p 'encodeURIComponent(process.env.PACKAGE_NAME)')"
          encoded_version="$(VERSION="$version" node -p 'encodeURIComponent(process.env.VERSION)')"

          if ! status="$(curl --silent --show-error --location --max-time 30 \
            --header 'Cache-Control: no-cache' \
            --output /dev/null --write-out '%{http_code}' \
            "https://registry.npmjs.org/${encoded_name}/${encoded_version}")"; then
            status=000
          fi

          case "$status" in
            200)
              echo "::error::${package_name}@${version} already exists on npm; refusing to build or publish it."
              exit 1
              ;;
            404)
              echo "${package_name}@${version} is not published yet."
              ;;
            *)
              echo "::error::Could not verify ${package_name}@${version} on npm (HTTP ${status}); refusing to publish."
              exit 1
              ;;
          esac

      - name: Install package dependencies
        run: pnpm install --frozen-lockfile

      - name: Build package
        run: pnpm run --if-present ${{ inputs.build-script }}

      - name: Run unit tests
        run: pnpm run --if-present ${{ inputs.test-script }}

      - name: Publish package
        run: pnpm publish --access public --no-git-checks --tag ${{ env.NPM_TAG }} --provenance

      - name: Create GitHub Release
        if: inputs.create-release == true
        uses: softprops/action-gh-release@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.package-version }}
          name: Release ${{ inputs.package-version }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.package-version, '-') }}